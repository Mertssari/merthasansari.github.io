<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mert Hasan Sarı | Yol Haritası</title>
    <meta name="description" content="Mert Hasan Sarı: Karabük Üniversitesi Bilgisayar Mühendisliği öğrencisi. Eğitim, projeler ve iletişim; kaydırdıkça ilerleyen bir yol haritası portfolyosu." />
    <meta name="theme-color" content="#f4efe6" />
    <meta name="author" content="Mert Hasan Sarı" />
    <link rel="canonical" href="https://merthasansari.me/" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1f26'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='17' fill='%23f4efe6' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://merthasansari.me/" />
    <meta property="og:title" content="Mert Hasan Sarı | Yol Haritası" />
    <meta property="og:description" content="Kaydır ve yolculuğa çık: Karabük Üniversitesi, projeler atölyesi ve iletişim." />
    <meta property="og:locale" content="tr_TR" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/yol.css?v=3" />
  </head>
  <body>
    <!-- Sabit sahne: harita SVG'si JS ile çizilir -->
    <div class="stage" aria-hidden="true">
      <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <header class="topbar">
      <a class="brand" href="#top" aria-label="Başa dön" data-i18n-aria="brand_aria">
        <span class="brand__mark">M</span>
        <span class="brand__name">Mert Hasan Sarı</span>
      </a>
      <div class="topbar__right">
        <div class="lang" role="group" aria-label="Dil seçimi" data-i18n-aria="lang_aria">
          <button class="lang__btn" type="button" data-lang="tr" aria-pressed="true">TR</button>
          <button class="lang__btn" type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <a class="topbar__link topbar__link--strong" href="#ozet" id="summaryBtn" aria-controls="summary">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.5h10M3 8h10M3 12.5h6"/></svg><span data-i18n="summary_btn">Özet görünüm</span>
        </a>
      </div>
    </header>

    <!-- Giriş -->
    <section class="hero" id="top">
      <img class="hero__avatar" src="assets/avatar.webp" alt="Mert Hasan Sarı" width="92" height="92" />
      <p class="hero__eyebrow" data-i18n="hero_eyebrow">Portfolyo · Yol Haritası</p>
      <h1 class="hero__title">Mert Hasan Sarı</h1>
      <p class="hero__lead" data-i18n="hero_lead">Bilgisayar Mühendisliği öğrencisi. Teknoloji ve estetiğin kesişiminde, güvenli ve ölçeklenebilir dijital deneyimler tasarlıyorum.</p>
      <div class="hero__cue"><span class="mouse" aria-hidden="true"><span></span></span><span data-i18n="hero_cue">Yolculuğa başlamak için kaydır</span></div>
    </section>

    <!-- Rota (ilerleme) -->
    <nav class="route" aria-label="Duraklar" data-i18n-aria="route_aria">
      <ol id="routeList"></ol>
    </nav>

    <!-- Durak kartı -->
    <article class="card" id="card" aria-live="polite" hidden></article>

    <!-- Özet görünüm: haritayı istemeyenler (ör. İK) için tek sayfalık CV. #ozet ile doğrudan açılır -->
    <section class="summary" id="summary" role="dialog" aria-modal="true" aria-labelledby="summaryTitle" hidden></section>

    <!-- Kaydırma alanı: yüksekliği JS belirler -->
    <div class="scroller" id="scroller"></div>

    <script src="data/projects.js?v=3"></script>
    <script src="assets/yol.js?v=3"></script>
  </body>
</html>
